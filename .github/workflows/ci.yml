name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Install reference Python
        run: uv python install
      - name: Tests, lint and formatting
        run: make check
      - name: Package build and installed CLI smoke test
        run: |
          make build
          uv venv .work/package-smoke --python 3.12
          uv pip install --python .work/package-smoke/bin/python --no-deps dist/*.whl
          .work/package-smoke/bin/strumbook --help
          .work/package-smoke/bin/strumbook --version
