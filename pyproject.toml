[project]
name = "strumbook"
version = "0.1.0.dev0"
description = "Build readable songbooks for ukulele groups from ChordPro collections."
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/strumbook/layout/fonts/OFL.txt"]
authors = [{ name = "Samuel Taylor" }]
requires-python = ">=3.12"
dependencies = [
    "typst==0.15.2",
]

[project.scripts]
strumbook = "strumbook.cli:main"

[dependency-groups]
dev = [
    "pypdf==7.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
